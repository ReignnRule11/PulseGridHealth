# PulseGrid Health — synthetic-data-only API staging on Render.
# PostgreSQL is hosted separately on Neon. No database or frontend is provisioned here.
# Do not load patient, employee, or other sensitive health data.
services:
  - type: web
    name: pulsegrid-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Free Render services do not support preDeployCommand. This single-instance
    # synthetic staging service applies migrations with a separate owner URL,
    # then verifies the restricted runtime URL before starting the API.
    # Move migrations to a dedicated release step before paid/multi-instance use.
    startCommand: alembic upgrade head && python scripts/verify_runtime_role.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: 'off'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: INVITATION_TTL_HOURS
        value: "72"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: MIN_BASELINE_POINTS
        value: "6"
      - key: ANOMALY_Z_THRESHOLD
        value: "3.5"
      - key: MIN_WORKFORCE_COHORT_SIZE
        value: "20"
      - key: AI_ENABLED
        value: "false"
