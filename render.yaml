# PulseGrid Health — synthetic-data-only staging resources.
# Primary staging topology: Vercel frontend + Render API + Neon PostgreSQL.
# Keep the pre-existing Render web service and PostgreSQL resource in this Blueprint
# so a Blueprint sync does not remove them. They are retained as legacy fallback
# resources and are NOT connected to the new API. Do not delete them without approval.
# Do not load patient, employee, or other sensitive health data.
services:
  - type: web
    name: pulsegrid-api
    runtime: python
    plan: free
    region: frankfurt
    rootDir: apps/api
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    # Free Render services do not support preDeployCommand. This single-instance
    # synthetic staging service applies migrations with a separate owner URL,
    # then verifies the restricted runtime URL before starting the API.
    # Move migrations to a dedicated release step before paid/multi-instance use.
    startCommand: alembic upgrade head && python scripts/verify_runtime_role.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT --no-access-log
    healthCheckPath: /health
    autoDeployTrigger: 'checksPass'
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: APP_ENV
        value: production
      - key: CORS_ORIGINS
        sync: false
      - key: BOOTSTRAP_TOKEN
        generateValue: true
      - key: SESSION_TTL_HOURS
        value: "12"
      - key: INVITATION_TTL_HOURS
        value: "72"
      - key: MAX_UPLOAD_MB
        value: "5"
      - key: MIN_BASELINE_POINTS
        value: "6"
      - key: ANOMALY_Z_THRESHOLD
        value: "3.5"
      - key: MIN_WORKFORCE_COHORT_SIZE
        value: "20"
      - key: AI_ENABLED
        value: "false"

  # Retained legacy fallback. Not the primary frontend deployment.
  - type: web
    name: pulsegrid-web
    runtime: node
    plan: free
    region: frankfurt
    rootDir: apps/web
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0 --port $PORT
    healthCheckPath: /
    autoDeployTrigger: 'off'
    envVars:
      - key: API_BACKEND_ORIGIN
        value: https://pulsegrid-api.onrender.com

databases:
  # Retained legacy fallback database. The API now uses Neon via protected env vars.
  - name: pulsegrid-staging-db
    databaseName: pulsegrid_staging
    user: pulsegrid_app
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"
