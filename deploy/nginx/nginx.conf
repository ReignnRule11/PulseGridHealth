# PulseGrid Health edge proxy template.
# Install as a complete nginx.conf. Replace hostname and certificate paths.
# Only Nginx should be publicly reachable; bind API, web and PostgreSQL privately.

worker_processes auto;
pid /var/run/nginx.pid;
events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;

  # Deliberately log URI without query string; never log headers or request bodies.
  log_format pulsegrid_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent $request_time request_id=$request_id';
  access_log /var/log/nginx/pulsegrid_access.log pulsegrid_safe;
  error_log /var/log/nginx/pulsegrid_error.log warn;

  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 6m;

  limit_req_zone $binary_remote_addr zone=api_general:10m rate=60r/m;
  limit_req_zone $binary_remote_addr zone=auth_general:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=auth_login:10m rate=5r/m;
  limit_req_zone $binary_remote_addr zone=uploads:10m rate=2r/m;
  limit_req_status 429;
  limit_conn_zone $binary_remote_addr zone=per_client:10m;

  upstream pulsegrid_api { server pulsegrid_api:8000; keepalive 16; }
  upstream pulsegrid_web { server pulsegrid_web:3000; keepalive 16; }

  server {
    listen 80;
    server_name pulsegrid.example.org;
    return 301 https://$host$request_uri;
  }

  server {
    listen 443 ssl;
    http2 on;
    server_name pulsegrid.example.org;
    ssl_certificate /etc/letsencrypt/live/pulsegrid.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pulsegrid.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    limit_conn per_client 20;

    location = /health {
      proxy_pass http://pulsegrid_api/health;
      include /etc/nginx/snippets/pulsegrid-proxy-headers.conf;
    }
    location = /ready {
      proxy_pass http://pulsegrid_api/ready;
      include /etc/nginx/snippets/pulsegrid-proxy-headers.conf;
    }
    location = /api/v1/auth/login {
      limit_req zone=auth_login burst=3 nodelay;
      proxy_pass http://pulsegrid_api;
      include /etc/nginx/snippets/pulsegrid-proxy-headers.conf;
    }
    location ^~ /api/v1/auth/ {
      limit_req zone=auth_general burst=5 nodelay;
      proxy_pass http://pulsegrid_api;
      include /etc/nginx/snippets/pulsegrid-proxy-headers.conf;
    }
    location = /api/v1/observations/import {
      limit_req zone=uploads burst=2 nodelay;
      proxy_pass http://pulsegrid_api;
      include /etc/nginx/snippets/pulsegrid-proxy-headers.conf;
    }
    location ^~ /api/ {
      limit_req zone=api_general burst=20 nodelay;
      proxy_pass http://pulsegrid_api;
      include /etc/nginx/snippets/pulsegrid-proxy-headers.conf;
    }
    location / {
      proxy_pass http://pulsegrid_web;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
